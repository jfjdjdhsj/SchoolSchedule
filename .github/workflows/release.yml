name: Release

# 推送 v* 标签时自动构建 Release APK 并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/schoolschedule.p12

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Create Release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 以附注标签（annotated tag）的内容作为更新日志
          NOTES=$(git tag -l --format='%(contents)' "$TAG" | sed '/^$/d')
          [ -z "$NOTES" ] && NOTES="校园作息表 $TAG"
          gh release create "$TAG" \
            "app/build/outputs/apk/release/app-release.apk#SchoolSchedule-$TAG-release.apk" \
            --title "校园作息表 $TAG" \
            --notes "$NOTES"
